[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
solana-security-txt = "1.1.1"
cfg-if = "1.0"
earn = { git = "https://github.com/m0-platform/solana-m", rev = "ab45d08", features = ["no-entrypoint"] }
