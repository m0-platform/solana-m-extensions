[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
solana-security-txt = "1.1.1"
cfg-if = "1.0"
# TEMP: local Anchor 1.2 earn (solana-m e562e04, unpushed). Switch to a pushed rev before any PR.
earn = { path = "../solana-m/programs/earn", features = ["no-entrypoint"] }
